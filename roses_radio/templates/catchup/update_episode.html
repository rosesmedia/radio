{% extends "base.html" %}

{% load django_bootstrap5 %}

{% block title %}Edit {{ episode.name }}{% endblock %}

{% block content %}
    <div class="card">
        <div class="card-header">
            <ul class="nav nav-tabs card-header-tabs">
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catchup:detail' episode.slug %}">View</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" aria-current="true">
                        <i class="bi bi-pen"></i>
                        Edit
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'catchup:update_tags' episode.slug %}">
                        <i class="bi bi-tags"></i>
                        Tags
                    </a>
                </li>
            </ul>
        </div>
        <div class="card-body">
            <h1>Edit {{ episode.name }}</h1>

            <form method="post" class="form" hx-disabled-elt="find button">
                {% csrf_token %}

                {% bootstrap_form form %}

                {% bootstrap_button button_type="submit" content="Save" %}
            </form>
        </div>
    </div>
{% endblock %}
