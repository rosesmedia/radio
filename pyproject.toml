[project]
name = "radio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery>=5.6.2",
    "django>=6.0.3",
    "django-bootstrap5>=26.2",
    "django-htmx>=1.27.0",
    "django-stubs-ext>=6.0.1",
    "psycopg>=3.3.2",
    "python-magic>=0.4.27",
    "requests>=2.33.1",
    "social-auth-app-django>=5.7.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "django-stubs[compatible-mypy]>=6.0.1",
    "mypy>=1.19.1",
    "ruff>=0.15.8",
    "types-requests>=2.33.0.20260408",
]

[tool.mypy]
exclude_gitignore = true
strict = true
plugins = ["mypy_django_plugin.main"]


[tool.django-stubs]
django_settings_module = "roses_radio.settings"
